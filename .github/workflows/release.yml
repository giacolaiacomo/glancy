name: Release

# When a release is published, build Glancy.app from the tag for Apple Silicon and Intel and check it.
# The download itself is the Developer ID signed, notarized DMG made by scripts/make-dmg.sh and
# attached to the release by the maintainer (signing keys never leave the maintainer's Mac).
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Xcode (Swift 6.2 or later)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build the universal app (ad-hoc signed)
        env:
          TAG: ${{ github.event.release.tag_name }}
          GLANCY_SIGN_IDENTITY: "-"
          UNIVERSAL: "1"
        run: GLANCY_VERSION="${TAG#v}" scripts/build-app.sh build/Glancy.app
      - name: Check it
        run: |
          lipo -archs build/Glancy.app/Contents/MacOS/Glancy | grep -q "x86_64 arm64"
          lipo -archs build/Glancy.app/Contents/Frameworks/MediaRemoteAdapter.framework/MediaRemoteAdapter | grep -q "x86_64 arm64"
          codesign --verify --strict build/Glancy.app
          build/Glancy.app/Contents/MacOS/Glancy --self-test
