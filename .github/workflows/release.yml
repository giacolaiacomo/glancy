name: Release

# When a release is published, build Glancy.app for Apple Silicon and Intel and attach it as a zip.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Xcode (Swift 6.2 or later)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Build the universal app (ad-hoc signed)
        env:
          TAG: ${{ github.event.release.tag_name }}
          GLANCY_SIGN_IDENTITY: "-"
          UNIVERSAL: "1"
        run: GLANCY_VERSION="${TAG#v}" scripts/build-app.sh build/Glancy.app
      - name: Check it
        run: |
          lipo -archs build/Glancy.app/Contents/MacOS/Glancy | grep -q "x86_64 arm64"
          lipo -archs build/Glancy.app/Contents/Frameworks/MediaRemoteAdapter.framework/MediaRemoteAdapter | grep -q "x86_64 arm64"
          codesign --verify --strict build/Glancy.app
          build/Glancy.app/Contents/MacOS/Glancy --self-test
      - name: Zip and attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          ZIP="Glancy-${TAG#v}.zip"
          ditto -c -k --keepParent build/Glancy.app "$ZIP"
          shasum -a 256 "$ZIP"
          gh release upload "$TAG" "$ZIP" --clobber
